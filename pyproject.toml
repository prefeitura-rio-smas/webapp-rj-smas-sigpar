[project]
name = "sigpar"
version = "0.1.0"
description = "SIGPAR-SMAS — webapp, API e ETL de monitoramento de parcerias"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "google-auth>=2.20",
  "requests>=2.31",
  "jinja2>=3.1",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["api"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B608: SQL com nomes de tabela/coluna internos e valores parametrizados.
# B310: urlopen apenas para endpoints https fixos do Google (ETL/backup).
skips = ["B404", "B603", "B607", "B110", "B310", "B608"]
